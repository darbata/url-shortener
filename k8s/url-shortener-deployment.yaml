apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: url-shortener
  name: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-shortener
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: url-shortener
    spec:
      containers:
      - image: darbata1/urlshortener-api
        imagePullPolicy: Always
        name: urlshortener-api
        envFrom:
          - configMapRef:
              name: url-shortener-config
          - secretRef:
              name: secret
        resources:
          requests:
            cpu: 100m
            memory: 300Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
            failureThreshold: 30
            periodSeconds: 5
