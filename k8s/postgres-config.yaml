apiVersion: v1
kind: ConfigMap
metadata:
  name: init-db
data:
  init-tables.sql: |
    CREATE TABLE urls (
      id BIGSERIAL PRIMARY KEY,
      long_url TEXT NOT NULL,
      code VARCHAR(7) NOT NULL UNIQUE,
      created_at TIMESTAMPTZ  NOT NULL DEFAULT NOW(),
      hits BIGINT NOT NULL DEFAULT 0
    );
