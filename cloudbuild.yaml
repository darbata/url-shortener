options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - 'darbata1/urlshortener-api:latest'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - login
      - -u
      - 'darbata1'
      - -p
      - 'dckr_pat_...' # obfuscated PAT - hardcode PAT was done as CloudBuild does not have access to Secret Manager either

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'darbata1/urlshortener-api:latest'
